name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 的默认 gcc 是 13，**只认 -std=c2x，不认 -std=c23**，
      # 直接用会报 `gcc: error: unrecognized command-line option '-std=c23'`。
      # 显式装 gcc-14：它才真正支持 C23，而且与板端工具链（ESP-IDF v5.5.5 的
      # xtensa g++ 14.2）以及本机 MinGW gcc 16 是同一代，CI 才有代表性。
      - name: 安装 GCC 14（C23 需要 gcc 14+）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14 g++-14
          gcc-14 --version | head -1

      - name: Python 语法检查
        run: python3 -m py_compile scripts/*.py tools/*.py

      # v4.0 起引擎分两层 + 目录分三家，编译也必须分两趟：
      #   core/*.c   推理核心，严格 C23（board / pc / phone 编同一份）
      #   pc/*.cpp   PC 侧驱动/套件，C++23
      # g++ 会把 .c 当 C++ 编，反之亦然，所以核心一律用 gcc -std=c23 先编成 .o。
      - name: 编译核心（C23，fp32 + q2 两套）
        working-directory: core
        run: |
          set -euo pipefail
          mkdir -p /tmp/core /tmp/core_q2
          for f in feng_model feng_llm feng_quant feng_smp feng_tokenizer \
                   feng_sample feng_calc feng_tools feng_memory; do
            gcc-14 -std=c23 -O2 -c $f.c -o /tmp/core/$f.o -I.
            gcc-14 -std=c23 -O2 -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 \
              -DFENG_FP16_WEIGHTS=1 -DFENG_MAX_SCORES=32768 \
              -c $f.c -o /tmp/core_q2/$f.o -I.
          done
          echo "C23 核心 fp32 + q2 两套编译通过"

      - name: 单测（算式 / 时间随机数 / 记忆 / 采样器）
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++23 -fno-exceptions -fno-rtti -fno-threadsafe-statics -O2"
          g++-14 $CXXFLAGS -o /tmp/pc_calc_test   pc/pc_calc_test.cpp   /tmp/core/feng_calc.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_tools_test  pc/pc_tools_test.cpp  /tmp/core/feng_tools.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_mem_test    pc/pc_mem_test.cpp    /tmp/core/feng_memory.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_sample_test pc/pc_sample_test.cpp /tmp/core/feng_sample.o \
              /tmp/core/feng_quant.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_calc_ask    pc/pc_calc_ask.cpp    /tmp/core/feng_calc.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_mem_ask     pc/pc_mem_ask.cpp     /tmp/core/feng_memory.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_rand_ask    pc/pc_rand_ask.cpp    /tmp/core/feng_tools.o -Icore -lm
          g++-14 $CXXFLAGS -o /tmp/pc_time_ask    pc/pc_time_ask.cpp    /tmp/core/feng_tools.o -Icore -lm
          for t in pc_calc_test pc_tools_test pc_mem_test pc_sample_test; do
            echo "== $t"
            /tmp/$t | tail -n 1
          done

      - name: C/Python tool 口径一致性（29 条）
        run: python3 tools/check_tool_parity.py --c-bin /tmp/pc_calc_ask

      - name: C/Python 记忆 tool 一致性（36 回合对话）
        run: python3 tools/check_mem_parity.py --c-bin /tmp/pc_mem_ask

      - name: C/Python 随机数一致性（56 组 seed/范围）
        run: python3 tools/check_rand_parity.py --c-bin /tmp/pc_rand_ask

      - name: C/Python 时间 tool 一致性（52 条，固定 epoch）
        run: python3 tools/check_time_parity.py --c-bin /tmp/pc_time_ask

      - name: 编译 PC 引擎（C23 核心 + C++23 套件 + 一致性检查）
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++23 -fno-exceptions -fno-rtti -fno-threadsafe-statics -O2"
          Q2="-DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -DFENG_FP16_WEIGHTS=1 -DFENG_MAX_SCORES=32768"
          CORE_Q2="/tmp/core_q2/feng_model.o /tmp/core_q2/feng_llm.o /tmp/core_q2/feng_quant.o \
                /tmp/core_q2/feng_smp.o /tmp/core_q2/feng_tokenizer.o /tmp/core_q2/feng_calc.o \
                /tmp/core_q2/feng_tools.o /tmp/core_q2/feng_memory.o /tmp/core_q2/feng_sample.o"
          CORE_FP32="/tmp/core/feng_model.o /tmp/core/feng_llm.o /tmp/core/feng_quant.o \
                /tmp/core/feng_smp.o /tmp/core/feng_tokenizer.o /tmp/core/feng_calc.o \
                /tmp/core/feng_tools.o /tmp/core/feng_memory.o /tmp/core/feng_sample.o"
          g++-14 $CXXFLAGS $Q2 -o /tmp/pc_chat_q2b8     pc/pc_chat.cpp     $CORE_Q2 -Icore -lm
          g++-14 $CXXFLAGS $Q2 -o /tmp/pc_kv_suite_q2b8 pc/pc_kv_suite.cpp $CORE_Q2 -Icore -lm
          g++-14 $CXXFLAGS $Q2 -o /tmp/pc_mt_suite      pc/pc_mt_suite.cpp $CORE_Q2 -Icore -lm
          g++-14 $CXXFLAGS     -o /tmp/pc_check         pc/pc_check.cpp    $CORE_FP32 -Icore -lm
          echo "PC 引擎全部编译通过（q2 核心与驱动宏一致；pc_check 用 fp32 核心）"

      - name: 手机端引擎编译（host x86-64；aarch64/NEON 见 phone/cli/build_wsl_aarch64.sh）
        working-directory: phone/cli
        run: |
          set -euo pipefail
          # CI 只验证同一份 C23 源码能在 host 编过；真正的 aarch64/NEON 需要
          # phone/cli/build_wsl_aarch64.sh（qemu）或真机，不在 ubuntu-latest 上跑。
          CC=gcc-14 CXX=g++-14 OUT=/tmp/phone_build bash build.sh
          echo "phone_chat 等产物："
          ls -la /tmp/phone_build | grep -v '^d'

      # 2026-10-23 起 phone/engine 不再是 core/ 的手工副本（那是持续 bug 源）：
      # 三端编同一份 core/*.c，手机差异走 -DFENG_PHONE=1。这个守卫防止副本回流。
      - name: 单一源码守卫（phone/engine 不得出现引擎副本）
        run: python3 phone/tools/check_single_source.py

      # A36/A37：否定句误杀、数词边界、序列完整性——这些判分边界直接决定头条分数，
      # 不能再靠人工抽查。只依赖标准库（torch 用空壳顶掉）。
      - name: 判分器回归（strict-v7 边界）
        run: python3 tests/test_eval_judge.py

      # 交叉编译：证明 aarch64 分支（NEON 内核 + pthread 线程池）真的能编过。
      # 只编译不运行——运行需要 qemu 与真机，见 tests/kernels 与 phone/cli/verify.sh。
      # 2026-10-23 单源化之后必须把 phone/engine 的两个文件也带上并真正链接：
      # 只编 core 的 9 个文件会漏掉 feng_phone.c / feng_neon.c（A34）。
      - name: 手机端 aarch64 交叉编译（NEON 分支 + 链接）
        run: |
          set -euo pipefail
          # Ubuntu 24.04 的默认包是 gcc-13（不认 -std=c23），优先装 14；装不上再退回默认包
          sudo apt-get install -y -qq gcc-14-aarch64-linux-gnu || \
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          A64="$(command -v aarch64-linux-gnu-gcc-14 || command -v aarch64-linux-gnu-gcc)"
          echo "交叉编译器：$A64（$($A64 -dumpversion)）"
          mkdir -p /tmp/a64
          "$A64" -std=c23 -O2 -Wall -Wextra \
              -DFENG_PHONE=1 -DFENG_FP16_WEIGHTS=1 \
              -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -Icore -Iphone/engine \
              -c core/feng_model.c -o /tmp/a64/feng_model.o
          for f in feng_llm feng_quant feng_smp feng_tokenizer \
                   feng_sample feng_calc feng_tools feng_memory; do
            "$A64" -std=c23 -O2 -Wall -Wextra \
              -DFENG_PHONE=1 -DFENG_FP16_WEIGHTS=1 \
              -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -Icore -Iphone/engine \
              -c core/$f.c -o /tmp/a64/$f.o
          done
          for f in feng_phone feng_neon; do
            "$A64" -std=c23 -O2 -Wall -Wextra \
              -DFENG_PHONE=1 -DFENG_FP16_WEIGHTS=1 \
              -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -Icore -Iphone/engine \
              -c phone/engine/$f.c -o /tmp/a64/$f.o
          done
          "$A64" -std=c23 -O2 -DFENG_PHONE=1 -DFENG_FP16_WEIGHTS=1 \
              -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -Icore -Iphone/engine \
              phone/cli/phone_chat.c /tmp/a64/*.o -o /tmp/a64/phone_chat -pthread -lm
          file /tmp/a64/phone_chat
          echo "aarch64（FENG_PHONE=1）11/11 编译 + phone_chat 链接通过"

      - name: 文档自检（干净 clone 口径）
        run: |
          python3 tools/check_md.py
          python3 tools/check_docs.py

      # 只跑启发式的第 2 层（署名上下文里像人名的报出来）。
      # 黑名单硬检查在本机跑——那份名字列表本身是私密的，不能进仓库。
      - name: 隐私自检（署名里不得出现中文人名）
        run: python3 tools/check_privacy.py

  # 内存安全回归：ASAN + UBSAN 跑引擎入口模糊测试与四套单测。
  # 2026-10-22 那轮抓到的 7 个真 bug（栈写穿、long long 溢出、全表泄漏）全部
  # 由这类夹具发现，但当时夹具放在 .cache 里没入库——这次连 CI 一起补上。
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 clang（msys2 的 gcc 没有 ASAN 运行时，统一用 clang）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          clang --version | head -1

      - name: sanitizer 回归（fuzz calc/tools/model + 四套单测）
        env:
          CC: clang
          CXX: clang++
          ROUNDS: "20000"
          OUT: /tmp/fuzz
        run: bash tests/fuzz/run.sh
